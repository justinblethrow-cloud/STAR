name: BlackSTAR CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackstar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ jq make python3-yaml samtools zlib1g-dev

      - name: Install architecture renderer
        run: npm ci --prefix extras/docs

      - name: Validate architecture atlas
        run: |
          python3 extras/docs/render_architecture.py --check --svg-only
          python3 extras/docs/validate_architecture.py

      - name: Validate benchmark harness syntax
        run: |
          bash -n extras/benchmarks/preparePublicAlignmentFixture.sh
          bash -n extras/benchmarks/runAlignmentA00.sh
          python3 -m py_compile \
            extras/benchmarks/makePairedFastqSubset.py \
            extras/benchmarks/quietSystemGate.py \
            extras/benchmarks/summarizeAlignmentA00.py \
            extras/benchmarks/compareAlignmentRuns.py \
            extras/benchmarks/evaluateAlignmentNoninferiority.py \
            extras/benchmarks/runAlignmentPairs.py
          extras/tests/scripts/testBenchmarkHarness.sh

      - name: Validate successor metadata
        run: |
          python3 -m py_compile \
            extras/maintenance/export_github_state.py \
            extras/maintenance/verify_transition_backup.py \
            extras/maintenance/check_detachment_readiness.py \
            extras/maintenance/finalize_successor_repo.py \
            extras/maintenance/validate_successor_metadata.py \
            extras/scripts/inspectBlackSTARBinary.py \
            extras/scripts/generateBlackSTARSbom.py
          python3 extras/maintenance/validate_successor_metadata.py

      - name: Build BlackSTAR release variants
        env:
          JOBS: "2"
        run: |
          CPU_TARGET=baseline extras/scripts/buildBlackSTARRelease.sh
          CPU_TARGET=avx2 extras/scripts/buildBlackSTARRelease.sh

      - name: Build independent release reproduction
        env:
          DIST_DIR: ${{ runner.temp }}/release-build-2
          JOBS: "2"
        run: |
          git worktree add --detach "${RUNNER_TEMP}/release-source-2" HEAD
          cd "${RUNNER_TEMP}/release-source-2"
          CPU_TARGET=baseline extras/scripts/buildBlackSTARRelease.sh
          CPU_TARGET=avx2 extras/scripts/buildBlackSTARRelease.sh

      - name: Verify cross-path release reproducibility
        run: |
          CPU_TARGET=baseline extras/scripts/compareBlackSTARReleases.sh dist "${RUNNER_TEMP}/release-build-2"
          CPU_TARGET=avx2 extras/scripts/compareBlackSTARReleases.sh dist "${RUNNER_TEMP}/release-build-2"

      - name: Verify release identity and OpenMP linkage
        run: |
          test "$(source/STAR --version)" = "2.7.11b-blackstar.3"
          EXPECTED_CPU_TARGET=avx2 extras/tests/scripts/testBlackstarVersion.sh
          ldd source/STAR | grep -Eq 'libgomp|libomp'
          test -f dist/blackstar-1.0.0-linux-x86_64-baseline.spdx.json
          test -f dist/blackstar-1.0.0-linux-x86_64-baseline/LICENSE
          test -f dist/blackstar-1.0.0-linux-x86_64-baseline/ATTRIBUTION.md
          test -f dist/blackstar-1.0.0-linux-x86_64-avx2.spdx.json
          grep -Fxq $'cpu_target\tbaseline' \
            dist/blackstar-1.0.0-linux-x86_64-baseline/compatibility.tsv
          grep -Fxq $'ymm_instructions\tabsent' \
            dist/blackstar-1.0.0-linux-x86_64-baseline/compatibility.tsv
          grep -Fxq $'cpu_target\tavx2' \
            dist/blackstar-1.0.0-linux-x86_64-avx2/compatibility.tsv
          grep -Fxq $'ymm_instructions\tpresent' \
            dist/blackstar-1.0.0-linux-x86_64-avx2/compatibility.tsv
          jq -e '
            .spdxVersion == "SPDX-2.3" and
            (.packages[] | select(.name == "BlackSTAR").versionInfo) == "1.0.0"
          ' dist/blackstar-1.0.0-linux-x86_64-baseline.spdx.json
          test "$(
            jq -r .documentNamespace \
              dist/blackstar-1.0.0-linux-x86_64-baseline.spdx.json
          )" != "$(
            jq -r .documentNamespace \
              dist/blackstar-1.0.0-linux-x86_64-avx2.spdx.json
          )"

      - name: Verify release variant result equivalence
        run: extras/tests/scripts/testReleaseVariants.sh

      - name: Build upstream 2.7.11b compatibility oracle
        run: |
          git worktree add "${RUNNER_TEMP}/star-upstream-2.7.11b" 2.7.11b
          make -C "${RUNNER_TEMP}/star-upstream-2.7.11b/source" -j2 STAR
          echo "UPSTREAM_STAR_BIN=${RUNNER_TEMP}/star-upstream-2.7.11b/source/STAR" >> "${GITHUB_ENV}"

      - name: Run specialized-mode compatibility tests
        env:
          KEEP_TEST_OUTPUT: "1"
          OUT_DIR: ${{ runner.temp }}/specialized-modes
          THREADS: "4"
        run: extras/tests/scripts/testSpecializedModes.sh

      - name: Run focused sanitizer tests
        run: |
          extras/tests/scripts/testAlignmentThreadAffinity.sh
          extras/tests/scripts/testNumaMemoryPolicy.sh
          extras/tests/scripts/testReadChunkConfig.sh
          extras/tests/scripts/testSystemMemory.sh
          extras/tests/scripts/testPackedArray.sh
          extras/tests/scripts/testSuffixComparator.sh
          extras/tests/scripts/testTranscriptInitialization.sh
          extras/tests/scripts/testParametersGenomeInitialization.sh
          extras/tests/scripts/testJunctionAlignment.sh
          extras/tests/scripts/testBlackstarSha256.sh

      - name: Run deployment selector tests
        run: extras/tests/scripts/testBlackstarSelector.sh

      - name: Run genome-insert acceptance tests
        env:
          KEEP_TEST_OUTPUT: "1"
          OUT_DIR: ${{ runner.temp }}/genome-insert-hardening
          THREADS: "4"
        run: extras/tests/scripts/testGenomeInsertHardening.sh

      - name: Run SAindex strategy equivalence tests
        env:
          KEEP_TEST_OUTPUT: "1"
          OUT_DIR: ${{ runner.temp }}/saindex-strategies
          PARALLEL_THREADS: "16"
        run: extras/tests/scripts/testSAindexParallel.sh

      - name: Check generated-tree cleanliness
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackstar-acceptance-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            dist
            ${{ runner.temp }}/release-build-2
            ${{ runner.temp }}/genome-insert-hardening
            ${{ runner.temp }}/saindex-strategies
            ${{ runner.temp }}/specialized-modes

  compiler-build:
    name: compiler-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cxx: g++
            packages: g++
          - name: clang
            cxx: clang++
            packages: clang libomp-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }} jq make zlib1g-dev

      - name: Build and inspect
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          make -C source -j2 STAR CXX="${CXX}"
          test "$(source/STAR --version)" = "2.7.11b-blackstar.3"
          source/STAR --version-json | jq -e '.blackstar_version == "1.0.0"'
          ldd source/STAR | grep -Eq 'libgomp|libomp'

  starlong-build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make zlib1g-dev

      - name: Build short-read and long-read binaries in one tree
        run: |
          make -C source -j2 STAR
          make -C source -j2 STARlong
          test -x source/STAR
          test -x source/STARlong

      - name: Build official STARlong compatibility oracle
        run: |
          git worktree add --detach "${RUNNER_TEMP}/star-upstream-long" 2.7.11b
          make -C "${RUNNER_TEMP}/star-upstream-long/source" -j2 STARlong
          echo "UPSTREAM_STARLONG_BIN=${RUNNER_TEMP}/star-upstream-long/source/STARlong" >> "${GITHUB_ENV}"

      - name: Exercise STARlong-only code and high-thread chunk sizing
        env:
          THREADS: "96"
          KEEP_TEST_OUTPUT: "1"
          OUT_DIR: ${{ runner.temp }}/starlong-smoke
          REQUIRE_UPSTREAM_STARLONG: "1"
        run: extras/tests/scripts/testSTARlong.sh

      - name: Upload STARlong smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackstar-starlong-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/starlong-smoke

  release-portability:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 45
    steps:
      - name: Install older-userspace build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y binutils g++ git gzip make python3 zlib1g-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build explicit CPU variants on glibc 2.31
        env:
          DIST_DIR: ${{ runner.temp }}/portable-dist
          JOBS: "2"
        run: |
          CPU_TARGET=baseline extras/scripts/buildBlackSTARRelease.sh
          CPU_TARGET=avx2 extras/scripts/buildBlackSTARRelease.sh

      - name: Verify ABI and ISA floors
        env:
          DIST_DIR: ${{ runner.temp }}/portable-dist
        run: |
          for target in baseline avx2; do
            compatibility="${DIST_DIR}/blackstar-1.0.0-linux-x86_64-${target}/compatibility.tsv"
            minimum_glibc="$(awk -F '\t' '$1=="minimum_glibc" {print $2}' "${compatibility}")"
            dpkg --compare-versions "${minimum_glibc}" le "2.31"
          done
          grep -Fxq $'ymm_instructions\tabsent' \
            "${DIST_DIR}/blackstar-1.0.0-linux-x86_64-baseline/compatibility.tsv"
          grep -Fxq $'ymm_instructions\tpresent' \
            "${DIST_DIR}/blackstar-1.0.0-linux-x86_64-avx2/compatibility.tsv"

      - name: Verify release variant result equivalence
        env:
          DIST_DIR: ${{ runner.temp }}/portable-dist
        run: extras/tests/scripts/testReleaseVariants.sh

      - name: Upload portability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackstar-portable-release-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/portable-dist
